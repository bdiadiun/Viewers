name: scoring bridge

on:
  pull_request:
    branches: [scoring]
  push:
    branches: [scoring]

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build the viewer with the scoring bridge extension
        run: OHIF_OPEN=false QUICK_BUILD=true yarn --cwd platform/app build:viewer
